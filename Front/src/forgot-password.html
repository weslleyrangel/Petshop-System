<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petshop - Recuperar Senha</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
<div class="login-page-container">
    <div class="login-box">
        <header class="login-header">
            <h1 class="app-title">PETSHOP</h1>
            <h2 class="login-title">RECUPERAR SENHA</h2>

            <div id="response-box" style="display: none; margin-top: 16px; padding: 12px; border-radius: 8px;">
                </div>
        </header>

        <form class="login-form" id="forgot-form">
            <p style="text-align: center; color: var(--text-light); font-size: 18px; margin-bottom: 24px;">
                Digite seu e-mail e enviaremos um link para redefinir sua senha.
            </p>
            <div class="form-group-grid">
                <label for="username" class="form-label">E-mail:</label>
                <input id="username" name="username" type="email" autocomplete="email" required class="form-input">
            </div>
            <div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Enviar
                </button>
            </div>
        </form>
        <p class="login-footer">
            Lembrou a senha?
            <a href="login.html">Fazer Login</a>
        </p>
    </div>
</div>

<script type="module">
    import { postData } from './js/utils/api.js';

    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
        e.preventDefault(); 
        const form = e.target;
        const username = form.username.value;
        const responseBox = document.getElementById("response-box");

        try {
            const response = await postData("/api/v1/auth/forgot-password", { username });

            // Exibe o popup com a mensagem de sucesso
            alert(response.message);
            
            // Opcional: Redirecionar para a tela de login ou esconder o formulário
            // window.location.href = "login.html"; 
            // form.style.display = 'none'; 

        } catch (error) {
            // Exibe o popup com a mensagem de erro
            alert(error.message || 'Erro ao enviar e-mail de recuperação.');
        }
    });
</script>
</body>
</html>
